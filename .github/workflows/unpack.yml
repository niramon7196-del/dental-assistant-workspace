name: unpack
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip
        run: |
          Z=$(ls *.zip | head -n1)
          mkdir /tmp/x && unzip -q "$Z" -d /tmp/x
          R=/tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" = "1" ] && [ -d "/tmp/x/$(ls -A /tmp/x)" ]; then R="/tmp/x/$(ls -A /tmp/x)"; fi
          cp -a "$R"/. .
          rm -f "$Z" .env.local
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack project v7"
          git push
